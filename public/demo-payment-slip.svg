<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 620" width="100%" height="100%">
  <defs>
    <linearGradient id="slipTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="slipShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Slip Background -->
  <rect x="15" y="15" width="420" height="590" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#slipShadow)" />

  <!-- Top Header Banner -->
  <path d="M 15 39 Q 15 15 39 15 L 411 15 Q 435 15 435 39 L 435 130 L 15 130 Z" fill="url(#slipTop)" />

  <!-- Bank / App Logo Header -->
  <g transform="translate(40, 32)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" />
    <!-- Bank Tree / Symbol -->
    <path d="M 16 6 L 24 20 L 8 20 Z" fill="#059669" />
    <text x="44" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">KBANK PROMPTPAY</text>
    <text x="44" y="28" font-family="sans-serif" font-size="9" fill="#d1fae5">E-Receipt / Transfer Slip</text>
  </g>

  <!-- Success Checkmark Badge -->
  <circle cx="225" cy="130" r="32" fill="#ffffff" stroke="#10b981" stroke-width="4" />
  <circle cx="225" cy="130" r="24" fill="#10b981" />
  <path d="M 215 130 L 222 137 L 236 122" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Status Text -->
  <text x="225" y="188" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">โอนเงินสำเร็จ</text>
  <text x="225" y="206" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">24 ต.ค. 2569 - 19:20 น.</text>

  <!-- Amount -->
  <g transform="translate(225, 255)">
    <rect x="-100" y="-30" width="200" height="48" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="0" y="2" font-family="sans-serif" font-size="24" font-weight="bold" fill="#059669" text-anchor="middle">฿1,500.00</text>
  </g>

  <!-- Transfer Details Section -->
  <g transform="translate(45, 295)">
    <!-- From -->
    <circle cx="12" cy="12" r="12" fill="#e0f2fe" />
    <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">จาก</text>
    <text x="36" y="10" font-family="sans-serif" font-size="11" fill="#64748b">จาก / From</text>
    <text x="36" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">นายพงศกร ใจดี</text>
    <text x="36" y="40" font-family="monospace" font-size="11" fill="#64748b">xxx-x-x1234-x (PromptPay)</text>

    <!-- Line divider with arrow -->
    <line x1="12" y1="52" x2="12" y2="78" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="12,82 8,74 16,74" fill="#94a3b8" />

    <!-- To -->
    <g transform="translate(0, 85)">
      <circle cx="12" cy="12" r="12" fill="#dcfce7" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">ถึง</text>
      <text x="36" y="10" font-family="sans-serif" font-size="11" fill="#64748b">ไปยัง / To</text>
      <text x="36" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">บจก. Car Rental Songkhla</text>
      <text x="36" y="40" font-family="monospace" font-size="11" fill="#64748b">081-254-5678 (KBank)</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="45" y1="450" x2="405" y2="450" stroke="#f1f5f9" stroke-width="2" />

  <!-- Reference & QR Area -->
  <g transform="translate(45, 470)">
    <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#64748b">เลขที่รายการ (Transaction Ref):</text>
    <text x="0" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#334155">20261024883921014498</text>

    <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#64748b">รหัสอ้างอิงการจอง (Booking Code):</text>
    <text x="0" y="68" font-family="monospace" font-size="12" font-weight="bold" fill="#0284c7">BK-DRIVENOW-AUTO</text>
  </g>

  <!-- Mini QR Stamp on Slip -->
  <g transform="translate(345, 465)">
    <rect x="0" y="0" width="55" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <!-- Mock QR pattern -->
    <rect x="5" y="5" width="16" height="16" fill="#0f172a" />
    <rect x="8" y="8" width="10" height="10" fill="#ffffff" />
    <rect x="10" y="10" width="6" height="6" fill="#0f172a" />

    <rect x="34" y="5" width="16" height="16" fill="#0f172a" />
    <rect x="37" y="8" width="10" height="10" fill="#ffffff" />
    <rect x="39" y="10" width="6" height="6" fill="#0f172a" />

    <rect x="5" y="34" width="16" height="16" fill="#0f172a" />
    <rect x="8" y="37" width="10" height="10" fill="#ffffff" />
    <rect x="10" y="39" width="6" height="6" fill="#0f172a" />
    
    <circle cx="28" cy="28" r="4" fill="#10b981" />
  </g>

  <!-- Slip Footer Text -->
  <text x="225" y="575" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">สแกนตรวจสอบสลิปได้ผ่าน Mobile Banking ทุกธนาคาร</text>
</svg>
