<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="35%" stop-color="#312e81" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Hologram Badge -->
    <linearGradient id="holoDl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.5" />
    </linearGradient>

    <filter id="dlShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.4" />
    </filter>

    <pattern id="dlPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#818cf8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="10" y="10" width="580" height="360" rx="20" fill="url(#dlBg)" stroke="#6366f1" stroke-width="2" filter="url(#dlShadow)" />
  <rect x="10" y="10" width="580" height="360" rx="20" fill="url(#dlPattern)" />

  <!-- Top Header Ribbon -->
  <rect x="10" y="10" width="580" height="52" rx="20" fill="#1e1b4b" opacity="0.85" />
  <rect x="10" y="58" width="580" height="4" fill="url(#purpleAccent)" />

  <!-- Department / Car Icon -->
  <g transform="translate(30, 20)">
    <!-- Car Graphic -->
    <rect x="0" y="12" width="28" height="12" rx="3" fill="#a855f7" />
    <circle cx="6" cy="25" r="4" fill="#f8fafc" stroke="#6b21a8" stroke-width="2" />
    <circle cx="22" cy="25" r="4" fill="#f8fafc" stroke="#6b21a8" stroke-width="2" />
    <path d="M 4 12 L 8 4 L 20 4 L 24 12 Z" fill="#c084fc" />
  </g>

  <!-- Header Titles -->
  <text x="75" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">ใบอนุญาตขับรถยนต์ส่วนบุคคล</text>
  <text x="75" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c084fc">DEPARTMENT OF LAND TRANSPORT - THAILAND</text>
  
  <rect x="420" y="20" width="150" height="26" rx="6" fill="#4338ca" />
  <text x="495" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DRIVING LICENCE</text>

  <!-- License Number -->
  <g transform="translate(35, 82)">
    <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#94a3b8">ฉบับที่ / License No.</text>
    <text x="0" y="22" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8" letter-spacing="2">DL-99182347</text>
  </g>

  <!-- Driver Details -->
  <g transform="translate(35, 135)">
    <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#94a3b8">ชื่อ-นามสกุล / Name-Surname</text>
    <text x="0" y="22" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">นายพงศกร ใจดี</text>
    <text x="0" y="40" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c7d2fe">MR. PONGSAKORN JAIDEE</text>

    <!-- Identification No Reference -->
    <text x="0" y="70" font-family="sans-serif" font-size="10" fill="#94a3b8">เลขประจำตัวประชาชน / ID No.</text>
    <text x="0" y="88" font-family="monospace" font-size="13" font-weight="bold" fill="#e2e8f0">1-1004-09876-54-3</text>

    <!-- License Type -->
    <text x="0" y="118" font-family="sans-serif" font-size="10" fill="#94a3b8">ชนิด / Category</text>
    <text x="0" y="136" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">รถยนต์ส่วนบุคคล (ชั่วคราว/5ปี)</text>
  </g>

  <!-- Driver Photo Box -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="145" height="185" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    
    <!-- User Avatar Silhouette -->
    <g transform="translate(22, 22)">
      <circle cx="50" cy="45" r="28" fill="#6366f1" />
      <circle cx="50" cy="43" r="24" fill="#818cf8" />
      <path d="M 26 40 Q 50 15 74 40 Q 65 24 50 24 Q 35 24 26 40 Z" fill="#0f172a" />
      <path d="M 10 135 C 10 95 30 85 50 85 C 70 85 90 95 90 135 Z" fill="#4338ca" />
      <polygon points="50,95 40,85 50,110 60,85" fill="#f8fafc" />
    </g>

    <!-- Holographic DLT Seal Badge -->
    <circle cx="118" cy="158" r="20" fill="url(#holoDl)" stroke="#c084fc" stroke-width="1.5" />
    <text x="118" y="162" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">DLT</text>
  </g>

  <!-- Issue & Expiry Dates Footer -->
  <g transform="translate(35, 310)">
    <line x1="0" y1="0" x2="530" y2="0" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="20" font-family="sans-serif" font-size="10" fill="#94a3b8">วันออกบัตร (Issue Date):</text>
    <text x="135" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">12 ม.ค. 2568</text>

    <text x="270" y="20" font-family="sans-serif" font-size="10" fill="#f87171">วันหมดอายุ (Expiry Date):</text>
    <text x="410" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">12 ม.ค. 2573 (5 ปี)</text>

    <text x="0" y="38" font-family="sans-serif" font-size="9" fill="#64748b">นายทะเบียนจังหวัดสงขลา / Songkhla Provincial Registrar</text>
  </g>
</svg>
